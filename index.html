<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Kavzz ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span>
  </div>

  <main class="page">
    <section class="hero">
      <p class="small-text">A little something for you...</p>
      <h1>I love u <span>Kavzz</span> ❤️</h1>
      <p class="subtitle">Some moments are too special to keep in a gallery.</p>
    </section>

    <section class="gallery">
      <div class="photo-card card-one">
        <img src="photo1.png" alt="A special memory" />
      </div>
      <div class="photo-card card-two">
        <img src="photo2.png" alt="A special memory" />
      </div>
      <div class="photo-card card-three">
        <img src="photo3.png" alt="A special memory" />
      </div>
    </section>

    <section class="message">
      <div class="line"></div>
      <p>❤️</p>
      <h2>Made with love, just for you.</h2>
      <p class="ending">I love u, Kavzz.</p>
    </section>
  </main>

  <script>
    // Small floating-heart effect
    const hearts = document.querySelector('.hearts');
    setInterval(() => {
      const heart = document.createElement('span');
      heart.textContent = Math.random() > 0.5 ? '♥' : '♡';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (5 + Math.random() * 5) + 's';
      hearts.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }, 900);
  </script>
</body>
</html>
